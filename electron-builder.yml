appId: com.hcode.app
productName: H-code
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
asar: true
extraResources:
  - from: src/renderer/assets/appIcon.png
    to: appIcon.png
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - nsis
  icon: resources/icon.ico
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
publish:
  provider: github
  owner: fusujifeng
  repo: H-code
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
