appId: com.hcode.app
productName: H-code
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!out/renderer/**/*"
asar: true
win:
  target:
    - nsis
  icon: resources/icon.ico
mac:
  target:
    - dmg
  icon: resources/icon.icns
linux:
  target:
    - AppImage
  icon: resources/icon.png
publish:
  provider: github
  owner: fusujifeng
  repo: H-code
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
