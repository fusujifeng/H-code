<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>H-code Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a3e;
      flex-shrink: 0;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.offline { background: #666; }
    .status-dot.online { background: #3498db; }
    .status-dot.paired { background: #2ecc71; }
    .status-dot.running { background: #f39c12; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    header .label { font-size: 13px; color: #999; flex: 1; }
    header .code { font-size: 18px; font-weight: 700; letter-spacing: 4px; color: #fff; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .msg { max-width: 90%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.5; word-break: break-word; }
    .msg.out { align-self: flex-end; background: #3498db; color: #fff; }
    .msg.in { align-self: flex-start; background: #2a2a3e; color: #e0e0e0; font-family: 'SF Mono', Monaco, monospace; font-size: 13px; white-space: pre-wrap; }
    .msg.event { align-self: center; background: transparent; color: #666; font-size: 12px; padding: 4px 8px; }
    .msg.alert { align-self: center; background: #f39c1222; color: #f39c12; font-size: 13px; }

    #input-area {
      padding: 10px 16px 24px;
      border-top: 1px solid #2a2a3e;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3a3a4e;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 16px;
      outline: none;
    }
    #input-area input:focus { border-color: #3498db; }
    #input-area button {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: #3498db;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #input-area button:active { opacity: 0.8; }
    #input-area button:disabled { background: #333; color: #666; }

    /* Pairing overlay */
    #pair-overlay {
      position: fixed; inset: 0;
      background: #0f0f1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; z-index: 100;
    }
    #pair-overlay.hidden { display: none; }
    #pair-overlay h1 { font-size: 24px; color: #fff; }
    #pair-overlay .hint { font-size: 14px; color: #999; text-align: center; line-height: 1.6; }
    #pair-overlay input {
      width: 200px; padding: 14px 20px;
      border-radius: 12px; border: 2px solid #3a3a4e;
      background: #1a1a2e; color: #fff;
      font-size: 28px; text-align: center;
      letter-spacing: 8px; outline: none;
    }
    #pair-overlay input:focus { border-color: #3498db; }
    #pair-overlay button {
      padding: 14px 40px;
      border-radius: 24px; border: none;
      background: #3498db; color: #fff;
      font-size: 16px; cursor: pointer;
    }
    #pair-overlay .error { color: #e74c3c; font-size: 14px; }
  </style>
</head>
<body>
  <!-- 配对面板 -->
  <div id="pair-overlay">
    <h1>H-code Remote</h1>
    <p class="hint">在桌面 H-code 中开启远程控制<br>输入屏幕上的 6 位配对码</p>
    <input id="code-input" type="text" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
    <button onclick="doPair()">连接</button>
    <p class="error" id="pair-error"></p>
  </div>

  <div id="app">
    <header>
      <div class="status-dot offline" id="status-dot"></div>
      <span class="label" id="status-label">未连接</span>
      <span class="code" id="header-code"></span>
    </header>
    <div id="messages"></div>
    <div id="input-area">
      <input id="cmd-input" type="text" placeholder="输入指令..." disabled autocomplete="off">
      <button id="send-btn" onclick="sendCommand()" disabled>→</button>
    </div>
  </div>

  <script>
    const RELAY = localStorage.relayServer || 'wss://hcode-relay.zeabur.app'
    let ws = null
    let state = 'offline'

    const $ = (s) => document.querySelector(s)
    const messages = $('#messages')
    const cmdInput = $('#cmd-input')
    const sendBtn = $('#send-btn')
    const pairOverlay = $('#pair-overlay')
    const statusDot = $('#status-dot')
    const statusLabel = $('#status-label')
    const headerCode = $('#header-code')

    function addMsg(type, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + type
      // Escape terminal escape sequences
      if (type === 'in') {
        text = text.replace(/\x1b\[[0-9;]*m/g, '').replace(/\x00/g, '')
      }
      el.textContent = text
      messages.appendChild(el)
      messages.scrollTop = messages.scrollHeight
    }

    function setStatus(s) {
      state = s
      statusDot.className = 'status-dot ' + s
      const labels = { offline: '未连接', online: '等待手机配对', paired: '已配对，待命', running: '执行中...' }
      statusLabel.textContent = labels[s] || s
      const disabled = s !== 'paired'
      cmdInput.disabled = disabled
      sendBtn.disabled = disabled
    }

    function connect(code) {
      addMsg('event', '正在连接...')
      ws = new WebSocket(RELAY)
      ws.onopen = () => {
        if (code) {
          ws.send(JSON.stringify({ type: 'pair', pairingCode: code }))
        }
      }
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data)
        switch (msg.type) {
          case 'paired':
            pairOverlay.classList.add('hidden')
            headerCode.textContent = msg.pairingCode
            localStorage.lastCode = msg.pairingCode
            setStatus('paired')
            addMsg('event', '✓ 已连接到桌面')
            break
          case 'task-start':
            setStatus('running')
            addMsg('event', '▸ ' + msg.payload)
            break
          case 'output':
            addMsg('in', msg.payload)
            break
          case 'task-end':
            setStatus('paired')
            addMsg('event', '✓ 任务完成 (exit: ' + msg.payload + ')')
            break
          case 'confirm-needed':
            addMsg('alert', '⚠ 桌面端需要确认权限，请在桌面操作')
            break
          case 'status':
            if (msg.payload === 'desktop-offline') {
              setStatus('offline')
              addMsg('event', '桌面端已断开')
            }
            break
          case 'error':
            addMsg('event', '✗ ' + msg.payload)
            break
        }
      }
      ws.onclose = () => {
        setStatus('offline')
        addMsg('event', '连接已断开')
      }
      ws.onerror = () => {
        $('#pair-error').textContent = '连接失败，请检查服务器地址'
      }
    }

    function doPair() {
      const code = $('#code-input').value.trim()
      if (code.length !== 6) {
        $('#pair-error').textContent = '请输入 6 位配对码'
        return
      }
      $('#pair-error').textContent = ''
      connect(code)
    }

    function sendCommand() {
      const text = cmdInput.value.trim()
      if (!text || !ws || ws.readyState !== 1) return
      ws.send(JSON.stringify({ type: 'command', payload: text }))
      addMsg('out', text)
      cmdInput.value = ''
    }

    // ── 键盘回车发送 ──
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendCommand()
    })

    // ── 自动重连 ──
    const lastCode = localStorage.lastCode
    if (lastCode) {
      $('#code-input').value = lastCode
      // 不自动连接，需要用户点击
    }

    // ── 配置服务器地址 ──
    if (!localStorage.relayServer) {
      const url = prompt('中继服务器地址（留空用默认）:', RELAY)
      if (url) localStorage.relayServer = url
    }
  </script>
</body>
</html>
