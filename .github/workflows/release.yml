name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          npm_config_python: python
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: node scripts/generate-icons.js

      - name: Build
        run: pnpm build

      - name: Package
        env:
          npm_config_python: python
        run: pnpm dist --publish never

      - name: List dist output
        if: always()
        shell: bash
        run: |
          echo "=== dist directory contents ==="
          ls -la dist/ 2>/dev/null || echo "dist/ does not exist or is empty"
          echo "=== checking for installers ==="
          find dist/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) 2>/dev/null || echo "No installer files found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify artifacts exist
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la dist/
          file_count=$(ls dist/ 2>/dev/null | wc -l)
          echo "File count: $file_count"
          if [ "$file_count" -eq 0 ]; then
            echo "ERROR: No artifacts were downloaded. Build jobs may have failed."
            exit 1
          fi

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for ${{ github.ref_name }}"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
